name: Sunshine Capability Diagnostic

on:
  workflow_dispatch:

jobs:
  sunshine-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 1. Install Sunshine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:TEMP\Sunshine-Windows-AMD64-installer.msi"
          $url = "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"
          Write-Host "--- Downloading Sunshine ---"
          Invoke-WebRequest -Uri $url -OutFile $installer
          if (-not (Test-Path $installer)) { throw "Sunshine installer download failed." }
          Write-Host "--- Installing Sunshine ---"
          $msi = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($msi.ExitCode -ne 0 -and $msi.ExitCode -ne 3010) { throw "Sunshine MSI installation failed: $($msi.ExitCode)" }
          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"
          if (-not (Test-Path $sunshine)) { throw "Sunshine executable not found." }
          Write-Host "Sunshine executable: $sunshine"
          & $sunshine --version

      - name: 2. Diagnose Display GPU and Hardware Encoding
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "========================================"
          Write-Host "DISPLAY / GPU / ENCODER DIAGNOSTICS"
          Write-Host "========================================"
          Write-Host "--- Video controllers ---"
          Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue |
            Select-Object Name,DriverVersion,VideoModeDescription,AdapterRAM,PNPDeviceID |
            Format-List
          Write-Host "--- Desktop monitors ---"
          Get-CimInstance Win32_DesktopMonitor -ErrorAction SilentlyContinue |
            Select-Object Name,ScreenWidth,ScreenHeight,PNPDeviceID |
            Format-List
          Write-Host "--- Sunshine bundled ffmpeg / hardware encoders ---"
          $ffmpegCandidates = @(
            "C:\Program Files\Sunshine\tools\ffmpeg.exe",
            "C:\Program Files\Sunshine\tools\ffmpeg\bin\ffmpeg.exe",
            "C:\Program Files\Sunshine\ffmpeg.exe"
          )
          $ffmpeg = $ffmpegCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($ffmpeg) {
            Write-Host "ffmpeg: $ffmpeg"
            & $ffmpeg -hide_banner -encoders 2>&1 |
              Select-String -Pattern "h264_(amf|nvenc|qsv)|hevc_(amf|nvenc|qsv)|av1_(amf|nvenc|qsv)" |
              ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "Bundled ffmpeg was not found in expected paths."
          }
          Write-Host "--- Relevant graphics processes/drivers ---"
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -match '(?i)(dwm|sunshine)' } |
            Select-Object Id,ProcessName,Path |
            Format-Table -AutoSize

      - name: 3. Start Sunshine and Inspect Capture Runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "========================================"
          Write-Host "SUNSHINE RUNTIME / CAPTURE TEST"
          Write-Host "========================================"
          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"
          $sunshineRuntimeOk = $false
          $sunshineExitCode = $null
          Get-Process -Name sunshine -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "--- Launching Sunshine as a diagnostic process ---"
          try {
            $proc = Start-Process -FilePath $sunshine -PassThru -WindowStyle Hidden
            Write-Host "Started Sunshine PID: $($proc.Id)"
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) {
              $sunshineExitCode = $proc.ExitCode
              $hexExit = ('0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$sunshineExitCode),0)))
              Write-Host "Sunshine exited during startup. ExitCode=$sunshineExitCode ($hexExit)"
              Write-Host "RUNTIME RESULT: FAIL - Sunshine process did not remain running."
            } else {
              $sunshineRuntimeOk = $true
              Write-Host "RUNTIME RESULT: PASS - Sunshine process remained running."
            }
          } catch {
            Write-Host "Sunshine launch exception: $($_.Exception.Message)"
            Write-Host "RUNTIME RESULT: FAIL - launch exception was captured for diagnostics."
          }

          Write-Host "--- Sunshine TCP listeners ---"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in @(47984,47989,47990,48010) } |
            Select-Object LocalAddress,LocalPort,OwningProcess |
            Sort-Object LocalPort |
            Format-Table -AutoSize

          Write-Host "--- Sunshine UDP listeners ---"
          Get-NetUDPEndpoint -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -ge 47998 -and $_.LocalPort -le 48000 } |
            Select-Object LocalAddress,LocalPort,OwningProcess |
            Sort-Object LocalPort |
            Format-Table -AutoSize

          Write-Host "--- Local Web UI TCP test ---"
          $web = Test-NetConnection -ComputerName 127.0.0.1 -Port 47990 -WarningAction SilentlyContinue
          Write-Host "47990 reachable: $($web.TcpTestSucceeded)"

          Write-Host "--- Sunshine process details ---"
          Get-CimInstance Win32_Process -Filter "Name='sunshine.exe'" -ErrorAction SilentlyContinue |
            Select-Object ProcessId,ExecutablePath,CommandLine |
            Format-List

          Write-Host "--- Sunshine log ---"
          $log = "C:\Program Files\Sunshine\config\sunshine.log"
          if (Test-Path $log) { Get-Content $log -ErrorAction SilentlyContinue } else { Write-Host "sunshine.log not found." }

          Write-Host "--- Sunshine config ---"
          $conf = "C:\Program Files\Sunshine\config\sunshine.conf"
          if (Test-Path $conf) {
            Write-Host "Config size: $((Get-Item $conf).Length) bytes"
            Get-Content $conf -ErrorAction SilentlyContinue
          } else { Write-Host "sunshine.conf not found." }

          Write-Host "--- Windows Application Error events near the test ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match '(?i)sunshine|sunshine\.exe' } |
            Select-Object -First 10 TimeCreated,Id,LevelDisplayName,Message |
            Format-List

          if ($sunshineExitCode -ne $null) {
            $hexExit = ('0x{0:X8}' -f ([BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$sunshineExitCode),0)))
            Write-Host "DIAGNOSTIC NOTE: Sunshine startup crash was recorded as $hexExit; this expected diagnostic failure will NOT fail the job."
          }

      - name: 4. Test Network Exposure
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "========================================"
          Write-Host "NETWORK EXPOSURE DIAGNOSTICS"
          Write-Host "========================================"
          try {
            $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
            Write-Host "Public IP reported by ipify: $publicIp"
          } catch {
            Write-Host "Public IP lookup failed: $($_.Exception.Message)"
          }
          Write-Host "--- Local IPv4 interfaces ---"
          Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.IPAddress -notlike "127.*" } |
            Select-Object InterfaceAlias,IPAddress,PrefixLength,AddressState |
            Format-Table -AutoSize
          Write-Host "--- Default routes ---"
          Get-NetRoute -AddressFamily IPv4 -ErrorAction SilentlyContinue |
            Where-Object { $_.DestinationPrefix -eq "0.0.0.0/0" } |
            Select-Object InterfaceAlias,NextHop,RouteMetric |
            Format-Table -AutoSize
          Write-Host "--- Sunshine firewall rules ---"
          Get-NetFirewallRule -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "*Sunshine*" } |
            Select-Object DisplayName,Enabled,Direction,Action,Profile |
            Format-Table -AutoSize
          Write-Host "--- Explicit Sunshine diagnostic firewall rules ---"
          New-NetFirewallRule -DisplayName "Sunshine Diagnostic TCP 47984-47990" -Direction Inbound -Protocol TCP -LocalPort 47984-47990 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Sunshine Diagnostic TCP 48010" -Direction Inbound -Protocol TCP -LocalPort 48010 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Sunshine Diagnostic UDP 47998-48000" -Direction Inbound -Protocol UDP -LocalPort 47998-48000 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          Write-Host "--- Final Sunshine endpoints ---"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in @(47984,47989,47990,48010) } |
            Select-Object LocalAddress,LocalPort,OwningProcess |
            Sort-Object LocalPort |
            Format-Table -AutoSize
          Get-NetUDPEndpoint -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -ge 47998 -and $_.LocalPort -le 48000 } |
            Select-Object LocalAddress,LocalPort,OwningProcess |
            Sort-Object LocalPort |
            Format-Table -AutoSize
          Write-Host "========================================"
          Write-Host "FINAL INTERPRETATION"
          Write-Host "========================================"
          Write-Host "- Hyper-V Video only means the cloud VM display adapter is being used, not the physical RX 580."
          Write-Host "- Missing AMF/NVENC/QSV encoders means the physical hardware encoder path is unavailable."
          Write-Host "- Sunshine startup crash is recorded without aborting this diagnostic job."
          Write-Host "- If Sunshine remains running but public ports are unreachable, that indicates GitHub runner NAT/inbound networking limitations."
          Write-Host "- Empty UDP endpoints before an actual Moonlight session are not by themselves proof of failure."
          Write-Host "- This workflow intentionally separates graphics/runtime failure from network exposure failure."
          Write-Host "========================================"
