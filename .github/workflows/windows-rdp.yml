name: Windows Cloud RDP + Parsec + YouTube Bot

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 0. Checkout repository
        uses: actions/checkout@v4

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

      - name: 2. Create Temporary RDP Administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) { throw "RDP_PASSWORD repository secret is missing." }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue
          if (-not $existingUser) { New-LocalUser -Name "NvDAdmin" -Password $securePassword -PasswordNeverExpires -AccountNeverExpires -Description "Temporary GitHub Actions RDP administrator" } else { Set-LocalUser -Name "NvDAdmin" -Password $securePassword }
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
          Write-Host "========================================"
          Write-Host "RDP CONNECTION DETAILS"
          Write-Host "RDP Host/IP : $publicIp"
          Write-Host "RDP Port    : 3389"
          Write-Host "RDP Username: NvDAdmin"
          Write-Host "RDP Password: Use the value stored in repository secret RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host "--- TCP listeners on 3389 ---"
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "--- Local RDP port test ---"
          Test-NetConnection -ComputerName "127.0.0.1" -Port 3389 | Select-Object ComputerName,RemotePort,TcpTestSucceeded

      - name: 3. Install and Configure Parsec
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "$env:TEMP\parsec-windows.exe"
          Invoke-WebRequest -Uri "https://builds.parsec.app/package/parsec-windows.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/silent /percomputer /vdd /norun" -Wait -PassThru
          if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw "Parsec installer failed with exit code $($proc.ExitCode)." }

          $parsecDir = "C:\ProgramData\Parsec"
          New-Item -ItemType Directory -Path $parsecDir -Force | Out-Null
          @(
            "app_host=1",
            "host_name=GitHub_Windows_VM",
            "server_max_clients=1",
            "encoder_bitrate=3",
            "encoder_fps=30",
            "server_resolution_x=1280",
            "server_resolution_y=720",
            "network_server_start_port=8000"
          ) | Set-Content -Path "$parsecDir\config.txt" -Encoding ascii

          New-NetFirewallRule -DisplayName "Parsec Host UDP 8000-8011" -Direction Inbound -Protocol UDP -LocalPort 8000-8011 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Parsec Host UDP 8000-8011 Outbound" -Direction Outbound -Protocol UDP -LocalPort 8000-8011 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Parsec STUN UDP 3478 Outbound" -Direction Outbound -Protocol UDP -RemotePort 3478 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null

          $service = Get-Service -Name "Parsec" -ErrorAction SilentlyContinue
          if ($service) {
            Stop-Service -Name $service.Name -Force -ErrorAction SilentlyContinue
            Set-Service -Name $service.Name -StartupType Disabled -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 3

          Write-Host "========================================"
          Write-Host "PARSEC INTERACTIVE SESSION TEST"
          Write-Host "The Parsec Windows service is intentionally stopped for this test."
          Write-Host "--- Installation paths ---"
          $parsecCandidates = @(
            "C:\Program Files\Parsec\parsecd.exe",
            "C:\Program Files (x86)\Parsec\parsecd.exe"
          )
          $parsecCandidates + "$parsecDir\config.txt" | ForEach-Object { Write-Host "$_ -> $(Test-Path $_)" }

          Write-Host "--- Service state after stop ---"
          Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Parsec*" -or $_.DisplayName -like "*Parsec*" } | Select-Object Name,DisplayName,Status,StartType | Format-Table -AutoSize

          Write-Host "--- Current Parsec processes ---"
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*parsec*' } | Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List

          Write-Host "--- Direct interactive parsecd.exe launch ---"
          $parsecd = $parsecCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($parsecd) {
            try {
              Write-Host "Launching in current Actions session: $parsecd"
              $direct = Start-Process -FilePath $parsecd -PassThru -WindowStyle Hidden
              Write-Host "Interactive launch PID: $($direct.Id)"
              Start-Sleep -Seconds 15
              $direct.Refresh()
              Write-Host "Interactive launch HasExited: $($direct.HasExited)"
              if ($direct.HasExited) { Write-Host "Interactive launch ExitCode: $($direct.ExitCode)" }
            } catch { Write-Host "Interactive launch exception: $($_.Exception.Message)" }
          } else { Write-Host "parsecd.exe was not found." }

          Write-Host "--- Processes after interactive launch ---"
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*parsec*' } | Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List

          Write-Host "--- UDP listeners 8000-8011 ---"
          Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 8000 -and $_.LocalPort -le 8011 } | Select-Object LocalAddress,LocalPort,OwningProcess | Format-Table -AutoSize

          Write-Host "--- Parsec logs ---"
          $logRoots = @("$env:ProgramData\Parsec", "$env:LOCALAPPDATA\Parsec", "$env:APPDATA\Parsec")
          foreach ($root in $logRoots) {
            if (Test-Path $root) {
              Write-Host "Log root: $root"
              Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.log','.txt') -or $_.Name -match 'log|parsec' } | Sort-Object LastWriteTime -Descending | Select-Object -First 10 FullName,Length,LastWriteTime | Format-Table -AutoSize
            }
          }

          Write-Host "--- Recent Parsec log tails ---"
          $logFiles = Get-ChildItem -Path $logRoots -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.log','.txt') -and $_.Name -match 'parsec|log' } | Sort-Object LastWriteTime -Descending | Select-Object -First 5
          foreach ($file in $logFiles) {
            Write-Host "### $($file.FullName) ###"
            Get-Content $file.FullName -Tail 80 -ErrorAction SilentlyContinue
          }

          Write-Host "--- Windows Application errors for Parsec ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -match 'Application Error|Windows Error Reporting' -and $_.Message -match '(?i)parsec|parsecd' } | Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message | Format-List

          Write-Host "--- Windows System errors mentioning Parsec ---"
          Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match '(?i)parsec|parsecd' } | Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message | Format-List

          Write-Host "--- HTTPS connectivity ---"
          foreach ($url in @("https://kessel-api.parsec.app","https://kessel-ws.parsec.app","https://builds.parsec.app")) {
            try {
              $r = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -TimeoutSec 15
              Write-Host "$url -> HTTP $($r.StatusCode) (reachable)"
            } catch {
              if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode; Write-Host "$url -> HTTP $status (reachable; application-level response)" } else { Write-Host "$url -> NETWORK FAILED: $($_.Exception.Message)" }
            }
          }

          Write-Host "--- UDP 3478 ---"
          try {
            $stun = [System.Net.Dns]::GetHostAddresses("stun.parsec.app") | Where-Object AddressFamily -eq "InterNetwork" | Select-Object -First 1
            if ($stun) {
              $udp = New-Object System.Net.Sockets.UdpClient
              $bytes = [System.Text.Encoding]::ASCII.GetBytes("parsec-stun-test")
              $sent = $udp.Send($bytes,$bytes.Length,$stun.IPAddressToString,3478)
              $udp.Close()
              Write-Host "UDP packet sent to $($stun.IPAddressToString):3478, bytes=$sent"
            } else { Write-Host "Could not resolve stun.parsec.app IPv4 address." }
          } catch { Write-Host "UDP 3478 test failed: $($_.Exception.Message)" }
          Write-Host "========================================"

      - name: 4. Verify Remote Access Services
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rdp = Get-Service -Name TermService -ErrorAction Stop
          if ($rdp.Status -ne "Running") { throw "RDP service is not running." }
          $parsec = Get-Service | Where-Object { $_.Name -like "*Parsec*" -or $_.DisplayName -like "*Parsec*" } | Select-Object -First 1
          if (-not $parsec) { throw "Parsec service is missing." }
          if (-not (Test-Path "C:\ProgramData\Parsec\config.txt")) { throw "Parsec config was not installed." }
          Write-Host "RDP service: $($rdp.Status)"
          Write-Host "Parsec service: $($parsec.Name) / $($parsec.Status)"
          Write-Host "Parsec config: PASS"
          if (Test-Path "C:\ProgramData\Parsec\user.bin") { Write-Host "Parsec authentication state: present" } else { Write-Host "Parsec authentication state: not signed in yet - use RDP and sign in manually." }

      - name: 5. Clone YouTube Downloader Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\youtube_downloader_bot"
          if (Test-Path $botPath) { Remove-Item -Path $botPath -Recurse -Force }
          git clone "https://github.com/siasoltoon/youtube_downloader_bot.git" $botPath
          Set-Location $botPath
          Write-Host "Bot repository cloned."
          Write-Host "Commit: $(git rev-parse --short HEAD)"

      - name: 6. Bootstrap Windows Bot Environment
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\setup_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows bootstrap failed." }

      - name: 7. Validate Bot Configuration
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("BOT_TOKEN","FILONE_ACCESS_KEY","FILONE_SECRET_KEY","FILONE_BUCKET","FILONE_ENDPOINT")
          foreach ($name in $required) { $value = [Environment]::GetEnvironmentVariable($name); if ([string]::IsNullOrWhiteSpace($value)) { throw "Required bot environment variable is missing: $name" } }
          py -3.13 scripts\healthcheck.py
          if ($LASTEXITCODE -ne 0) { throw "Bot health check failed." }

      - name: 8. Start YouTube Downloader Bot
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          FILONE_URL_EXPIRES: ${{ secrets.FILONE_URL_EXPIRES }}
          TELEGRAM_DIRECT_VIDEO_LIMIT_MB: ${{ secrets.TELEGRAM_DIRECT_VIDEO_LIMIT_MB }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = "C:\youtube_downloader_bot\bot.log"
          $stderr = "C:\youtube_downloader_bot\bot-error.log"
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
          if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path $python)) { throw "Could not resolve the Python 3.13 executable." }
          $process = Start-Process -FilePath $python -ArgumentList "-u bot.py" -WorkingDirectory "C:\youtube_downloader_bot" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $process.Id | Out-File -FilePath $pidFile -Encoding ascii
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }; if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }; throw "YouTube Downloader Bot stopped during startup." }
          Write-Host "Bot is running successfully. PID: $($process.Id)"

      - name: 9. Keep Windows VM Alive
        shell: powershell
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          FILONE_URL_EXPIRES: ${{ secrets.FILONE_URL_EXPIRES }}
          TELEGRAM_DIRECT_VIDEO_LIMIT_MB: ${{ secrets.TELEGRAM_DIRECT_VIDEO_LIMIT_MB }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\youtube_downloader_bot"
          $pidFile = "$botPath\bot.pid"
          $stdout = "$botPath\bot.log"
          $stderr = "$botPath\bot-error.log"
          if (-not (Test-Path $pidFile)) { throw "Bot PID file was not found." }
          $botPid = [int](Get-Content $pidFile)
          Write-Host "Windows VM is ready"
          Write-Host "Parsec is installed; sign in manually through RDP if this is a fresh VM."
          for ($minute = 0; $minute -lt 350; $minute += 5) {
              Start-Sleep -Seconds 300
              $process = Get-Process -Id $botPid -ErrorAction SilentlyContinue
              if ($process) { Write-Host "[$minute minutes] VM alive | Bot PID $botPid running"; continue }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 150 }
              if (Test-Path $stdout) { Get-Content $stdout -Tail 150 }
              $restartCount = 0; $restarted = $false
              while ($restartCount -lt 3 -and -not $restarted) {
                  $restartCount++
                  $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
                  $process = Start-Process -FilePath $python -ArgumentList "-u bot.py" -WorkingDirectory $botPath -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                  $botPid = $process.Id
                  $botPid | Out-File -FilePath $pidFile -Encoding ascii
                  Start-Sleep -Seconds 10
                  $process.Refresh()
                  if (-not $process.HasExited) { $restarted = $true; Write-Host "Bot restarted successfully. PID: $botPid" }
              }
              if (-not $restarted) { throw "Bot stopped and could not be restarted after 3 attempts." }
          }

      - name: 10. Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Workflow cleanup complete."
