name: Windows Cloud RDP + RustDesk + YouTube Bot

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 0. Checkout repository
        uses: actions/checkout@v4
      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0
      - name: 2. Create Temporary RDP Administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) { throw "RDP_PASSWORD repository secret is missing." }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue
          if (-not $existingUser) { New-LocalUser -Name "NvDAdmin" -Password $securePassword -PasswordNeverExpires -AccountNeverExpires -Description "Temporary GitHub Actions RDP administrator" } else { Set-LocalUser -Name "NvDAdmin" -Password $securePassword }
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
      - name: 3. Install and Configure RustDesk
        shell: powershell
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD || secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\setup_rustdesk_msi_final.ps1"
          if ($LASTEXITCODE -ne 0) { throw "RustDesk setup failed." }
      - name: 4. Verify Remote Access Services
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rdp = Get-Service -Name TermService -ErrorAction Stop
          if ($rdp.Status -ne "Running") { throw "RDP service is not running." }
          $rustdeskService = Get-Service | Where-Object { $_.Name -like "RustDesk*" -or $_.DisplayName -like "RustDesk*" } | Select-Object -First 1
          if (-not $rustdeskService) { throw "RustDesk service is missing." }
          if ($rustdeskService.Status -ne "Running") { throw "RustDesk service is not running." }
          Write-Host "RDP service: $($rdp.Status)"
          Write-Host "RustDesk service: $($rustdeskService.Status)"
      - name: 4A. RustDesk Network Diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $hostName = "rs-ny.rustdesk.com"
          Write-Host "=== RustDesk Network Diagnostics ==="
          Write-Host "Hostname: $hostName"
          try {
            $dns = Resolve-DnsName $hostName -ErrorAction Stop | Where-Object { $_.Type -eq "A" } | Select-Object -First 1
            Write-Host "DNS: PASS ($($dns.IPAddress))"
          } catch { Write-Host "DNS: FAIL ($($_.Exception.Message))" }
          foreach ($port in @(21116,21117)) {
            try {
              $tcp = Test-NetConnection -ComputerName $hostName -Port $port -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tcp) { Write-Host "TCP $port: PASS" } else { Write-Host "TCP $port: FAIL" }
            } catch { Write-Host "TCP $port: ERROR ($($_.Exception.Message))" }
          }
          Write-Host "UDP 21116: testing with .NET UDP socket..."
          try {
            $udp = New-Object System.Net.Sockets.UdpClient
            $udp.Client.ReceiveTimeout = 3000
            $bytes = [Text.Encoding]::UTF8.GetBytes("rustdesk-diagnostic")
            [void]$udp.Send($bytes,$bytes.Length,$hostName,21116)
            Write-Host "UDP 21116: PACKET_SENT (UDP is connectionless; no reply is required)"
            $udp.Close()
          } catch { Write-Host "UDP 21116: ERROR ($($_.Exception.Message))" }
          $rustdesk = "C:\Program Files\RustDesk\rustdesk.exe"
          if (Test-Path $rustdesk) {
            Write-Host "RustDesk executable: PASS"
            $idFile = "$env:TEMP\rustdesk-diag-id.txt"
            Remove-Item $idFile -Force -ErrorAction SilentlyContinue
            Start-Process -FilePath $rustdesk -ArgumentList "--get-id" -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $idFile | Out-Null
            $id = if (Test-Path $idFile) { (Get-Content $idFile -Raw).Trim() } else { "" }
            if ($id) { Write-Host "RustDesk ID: $id" } else { Write-Host "RustDesk ID: FAIL" }
          } else { Write-Host "RustDesk executable: FAIL" }
          $service = Get-Service | Where-Object { $_.Name -like "RustDesk*" -or $_.DisplayName -like "RustDesk*" } | Select-Object -First 1
          if ($service) { Write-Host "RustDesk service: $($service.Name) / $($service.Status)" } else { Write-Host "RustDesk service: FAIL" }
          Write-Host "=== End RustDesk Network Diagnostics ==="
      - name: 5. Clone YouTube Downloader Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\youtube_downloader_bot"
          if (Test-Path $botPath) { Remove-Item -Path $botPath -Recurse -Force }
          git clone "https://github.com/siasoltoon/youtube_downloader_bot.git" $botPath
          Set-Location $botPath
          Write-Host "Bot repository cloned."
          Write-Host "Commit: $(git rev-parse --short HEAD)"
      - name: 6. Bootstrap Windows Bot Environment
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\setup_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows bootstrap failed." }
      - name: 7. Validate Bot Configuration
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("BOT_TOKEN","FILONE_ACCESS_KEY","FILONE_SECRET_KEY","FILONE_BUCKET","FILONE_ENDPOINT")
          foreach ($name in $required) { $value = [Environment]::GetEnvironmentVariable($name); if ([string]::IsNullOrWhiteSpace($value)) { throw "Required bot environment variable is missing: $name" } }
          py -3.13 scripts\healthcheck.py
          if ($LASTEXITCODE -ne 0) { throw "Bot health check failed." }
      - name: 8. Start YouTube Downloader Bot
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          FILONE_URL_EXPIRES: ${{ secrets.FILONE_URL_EXPIRES }}
          TELEGRAM_DIRECT_VIDEO_LIMIT_MB: ${{ secrets.TELEGRAM_DIRECT_VIDEO_LIMIT_MB }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = "C:\youtube_downloader_bot\bot.log"
          $stderr = "C:\youtube_downloader_bot\bot-error.log"
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
          if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path $python)) { throw "Could not resolve the Python 3.13 executable." }
          $process = Start-Process -FilePath $python -ArgumentList "-u bot.py" -WorkingDirectory "C:\youtube_downloader_bot" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $process.Id | Out-File -FilePath $pidFile -Encoding ascii
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }; if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }; throw "YouTube Downloader Bot stopped during startup." }
          Write-Host "Bot is running successfully. PID: $($process.Id)"
      - name: 9. Keep Windows VM Alive
        shell: powershell
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          FILONE_URL_EXPIRES: ${{ secrets.FILONE_URL_EXPIRES }}
          TELEGRAM_DIRECT_VIDEO_LIMIT_MB: ${{ secrets.TELEGRAM_DIRECT_VIDEO_LIMIT_MB }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\youtube_downloader_bot"
          $pidFile = "$botPath\bot.pid"
          $stdout = "$botPath\bot.log"
          $stderr = "$botPath\bot-error.log"
          if (-not (Test-Path $pidFile)) { throw "Bot PID file was not found." }
          $botPid = [int](Get-Content $pidFile)
          Write-Host "Windows VM is ready"
          Write-Host "RustDesk is enabled (Tailscale is not used)"
          for ($minute = 0; $minute -lt 350; $minute += 5) {
              Start-Sleep -Seconds 300
              $process = Get-Process -Id $botPid -ErrorAction SilentlyContinue
              if ($process) { Write-Host "[$minute minutes] VM alive | Bot PID $botPid running"; continue }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 150 }
              if (Test-Path $stdout) { Get-Content $stdout -Tail 150 }
              $restartCount = 0; $restarted = $false
              while ($restartCount -lt 3 -and -not $restarted) {
                  $restartCount++
                  $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
                  $process = Start-Process -FilePath $python -ArgumentList "-u bot.py" -WorkingDirectory $botPath -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
                  $botPid = $process.Id; $botPid | Out-File -FilePath $pidFile -Encoding ascii
                  Start-Sleep -Seconds 15; $process.Refresh()
                  if (-not $process.HasExited) { $restarted = $true; Write-Host "Bot restart succeeded. New PID: $botPid" }
                  else { if (Test-Path $stderr) { Get-Content $stderr -Tail 150 }; Start-Sleep -Seconds 15 }
              }
              if (-not $restarted) { throw "Bot could not be kept running after 3 restart attempts." }
          }
      - name: 10. Cleanup
        if: always()
        shell: powershell
        run: |
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          if (Test-Path $pidFile) { try { Stop-Process -Id ([int](Get-Content $pidFile)) -Force -ErrorAction SilentlyContinue } catch {} }
          Write-Host "Cleanup completed."
