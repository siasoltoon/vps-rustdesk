name: Windows Cloud RDP + Sunshine + YouTube Bot

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 0. Checkout repository
        uses: actions/checkout@v4

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

      - name: 2. Create Temporary RDP Administrator
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) { throw "RDP_PASSWORD repository secret is missing." }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $existingUser = Get-LocalUser -Name "NvDAdmin" -ErrorAction SilentlyContinue
          if (-not $existingUser) {
            New-LocalUser -Name "NvDAdmin" -Password $securePassword -PasswordNeverExpires -AccountNeverExpires -Description "Temporary GitHub Actions RDP administrator"
          } else {
            Set-LocalUser -Name "NvDAdmin" -Password $securePassword
          }
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org?format=json").ip
          Write-Host "========================================"
          Write-Host "RDP CONNECTION DETAILS"
          Write-Host "RDP Host/IP : $publicIp"
          Write-Host "RDP Port    : 3389"
          Write-Host "RDP Username: NvDAdmin"
          Write-Host "RDP Password: Use the value stored in repository secret RDP_PASSWORD"
          Write-Host "========================================"
          Write-Host "--- TCP listeners on 3389 ---"
          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "--- Local RDP port test ---"
          Test-NetConnection -ComputerName "127.0.0.1" -Port 3389 | Select-Object ComputerName,RemotePort,TcpTestSucceeded

      - name: 3. Remove Parsec and Install Sunshine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "========================================"
          Write-Host "REMOVE PARSEC + INSTALL SUNSHINE"
          Write-Host "========================================"

          Write-Host "--- Removing any Parsec services/processes ---"
          Get-Process -Name "parsec","parsecd","pservice" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $parsecServices = Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Parsec*" -or $_.DisplayName -like "*Parsec*" }
          foreach ($svc in $parsecServices) {
            Stop-Service -Name $svc.Name -Force -ErrorAction SilentlyContinue
            & sc.exe delete $svc.Name | Out-Host
          }

          Write-Host "--- Removing Parsec firewall rules ---"
          Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Parsec*" } | Remove-NetFirewallRule -ErrorAction SilentlyContinue

          Write-Host "--- Removing Parsec installation ---"
          $uninstallEntries = @()
          $uninstallEntries += @(Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue)
          $uninstallEntries += @(Get-ItemProperty "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue)
          $uninstallEntries = $uninstallEntries | Where-Object { $_.DisplayName -like "*Parsec*" }
          foreach ($entry in $uninstallEntries) {
            if ($entry.UninstallString) {
              Write-Host "Found Parsec uninstall entry: $($entry.DisplayName)"
              try {
                $cmd = $entry.UninstallString
                if ($cmd -match 'msiexec') {
                  Start-Process -FilePath "msiexec.exe" -ArgumentList "/x $($entry.PSChildName) /qn /norestart" -Wait -PassThru | Out-Null
                } else {
                  Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$cmd`" /S /quiet /norestart" -Wait -WindowStyle Hidden -ErrorAction SilentlyContinue | Out-Null
                }
              } catch {
                Write-Host "Parsec uninstall attempt failed: $($_.Exception.Message)"
              }
            }
          }
          Remove-Item "C:\Program Files\Parsec" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Program Files (x86)\Parsec" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\ProgramData\Parsec" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "--- Downloading official Sunshine Windows AMD64 installer ---"
          $installer = "$env:TEMP\Sunshine-Windows-AMD64-installer.msi"
          $sunshineUrl = "https://github.com/LizardByte/Sunshine/releases/latest/download/Sunshine-Windows-AMD64-installer.msi"
          Invoke-WebRequest -Uri $sunshineUrl -OutFile $installer
          if (-not (Test-Path $installer)) { throw "Sunshine installer download failed." }

          Write-Host "--- Installing Sunshine ---"
          $msi = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
          if ($msi.ExitCode -ne 0 -and $msi.ExitCode -ne 3010) { throw "Sunshine MSI installation failed with exit code $($msi.ExitCode)." }

          $sunshineCandidates = @(
            "C:\Program Files\Sunshine\sunshine.exe",
            "C:\Program Files (x86)\Sunshine\sunshine.exe"
          )
          $sunshine = $sunshineCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sunshine) { throw "Sunshine executable was not found after installation." }

          Write-Host "Sunshine executable: $sunshine"
          & $sunshine --version

          Write-Host "--- Sunshine Windows services ---"
          Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -like "*Sunshine*" -or $_.DisplayName -like "*Sunshine*" } | Select-Object Name,DisplayName,Status,StartType | Format-Table -AutoSize

          Write-Host "--- Sunshine firewall rules ---"
          Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Sunshine*" } | Select-Object DisplayName,Enabled,Direction,Action | Format-Table -AutoSize

          Write-Host "--- Adding explicit Sunshine streaming firewall rules ---"
          New-NetFirewallRule -DisplayName "Sunshine TCP 47984-47990" -Direction Inbound -Protocol TCP -LocalPort 47984-47990 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Sunshine TCP 48010" -Direction Inbound -Protocol TCP -LocalPort 48010 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null
          New-NetFirewallRule -DisplayName "Sunshine UDP 47998-48000" -Direction Inbound -Protocol UDP -LocalPort 47998-48000 -Action Allow -Profile Any -ErrorAction SilentlyContinue | Out-Null

          Write-Host "========================================"
          Write-Host "SUNSHINE SERVICE / SESSION TEST"
          Write-Host "========================================"
          Write-Host "--- Display adapters ---"
          Get-CimInstance Win32_VideoController -ErrorAction SilentlyContinue | Select-Object Name,DriverVersion,VideoModeDescription | Format-Table -AutoSize

          Write-Host "--- Existing Sunshine processes ---"
          $existingSunshine = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "sunshine.exe" }
          $existingSunshine | Select-Object ProcessId,Name,ExecutablePath,CommandLine | Format-List

          Write-Host "--- Sunshine service status ---"
          $sunshineService = Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "SunshineService" -or $_.DisplayName -eq "Sunshine Service" } | Select-Object -First 1
          if ($sunshineService) {
            Write-Host "Sunshine service: $($sunshineService.Status) / $($sunshineService.StartType)"
            if ($sunshineService.Status -ne "Running") {
              Start-Service -Name $sunshineService.Name -ErrorAction Stop
              Start-Sleep -Seconds 5
              $sunshineService.Refresh()
              Write-Host "Sunshine service after start: $($sunshineService.Status)"
            }
          } else {
            Write-Host "Sunshine service was not found; checking standalone process."
          }

          Write-Host "--- Verifying Sunshine process without launching a duplicate instance ---"
          Start-Sleep -Seconds 5
          $sunshineProcess = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "sunshine.exe" } | Select-Object -First 1
          if ($sunshineProcess) {
            Write-Host "Sunshine process is running (PID $($sunshineProcess.ProcessId))."
          } else {
            Write-Host "Sunshine process is not running; attempting one standalone launch."
            $sunshineProcessHandle = Start-Process -FilePath $sunshine -PassThru -WindowStyle Hidden
            Start-Sleep -Seconds 15
            $sunshineProcessHandle.Refresh()
            if ($sunshineProcessHandle.HasExited) {
              Write-Host "Standalone Sunshine ExitCode: $($sunshineProcessHandle.ExitCode)"
              throw "Sunshine failed to remain running and no Sunshine service process was available."
            }
            Write-Host "Standalone Sunshine process is running (PID $($sunshineProcessHandle.Id))."
          }

          Write-Host "--- Sunshine TCP listeners ---"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 47984 -and $_.LocalPort -le 48010 } | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort | Format-Table -AutoSize

          Write-Host "--- Sunshine UDP listeners ---"
          Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 47998 -and $_.LocalPort -le 48002 } | Select-Object LocalAddress,LocalPort,OwningProcess | Sort-Object LocalPort | Format-Table -AutoSize

          Write-Host "--- Local Sunshine Web UI test ---"
          $webPort = Test-NetConnection -ComputerName "127.0.0.1" -Port 47990 -WarningAction SilentlyContinue
          $webPort | Select-Object ComputerName,RemotePort,TcpTestSucceeded
          if (-not $webPort.TcpTestSucceeded) { throw "Sunshine Web UI TCP port 47990 is not listening." }

          try {
            $previousCallback = [System.Net.ServicePointManager]::ServerCertificateValidationCallback
            [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
            $web = Invoke-WebRequest -Uri "https://127.0.0.1:47990" -UseBasicParsing -TimeoutSec 10
            Write-Host "Sunshine Web UI -> HTTP $($web.StatusCode)"
          } catch {
            Write-Host "Sunshine Web UI HTTP request: $($_.Exception.Message)"
          } finally {
            [System.Net.ServicePointManager]::ServerCertificateValidationCallback = $previousCallback
          }

          Write-Host "--- Sunshine logs/config files ---"
          $sunshineRoots = @("C:\Program Files\Sunshine\config", "$env:ProgramData\Sunshine", "$env:LOCALAPPDATA\Sunshine")
          foreach ($root in $sunshineRoots) {
            if (Test-Path $root) {
              Write-Host "Root: $root"
              Get-ChildItem -Path $root -Recurse -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 15 FullName,Length,LastWriteTime | Format-Table -AutoSize
            }
          }

          Write-Host "--- Recent Sunshine application errors ---"
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Where-Object { $_.Message -match '(?i)sunshine' } | Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message | Format-List
          Write-Host "========================================"

      - name: 4. Verify Remote Access And Sunshine
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rdp = Get-Service -Name TermService -ErrorAction Stop
          if ($rdp.Status -ne "Running") { throw "RDP service is not running." }
          $sunshineProcess = Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq "sunshine.exe" } | Select-Object -First 1
          Write-Host "RDP service: $($rdp.Status)"
          if ($sunshineProcess) {
            Write-Host "Sunshine process: RUNNING (PID $($sunshineProcess.ProcessId))"
          } else {
            throw "Sunshine process is not running."
          }
          $webPort = Test-NetConnection -ComputerName "127.0.0.1" -Port 47990 -WarningAction SilentlyContinue
          $webPort | Select-Object ComputerName,RemotePort,TcpTestSucceeded
          if (-not $webPort.TcpTestSucceeded) { throw "Sunshine Web UI port 47990 is not reachable locally." }
          Write-Host "Parsec is not part of this workflow."

      - name: 5. Clone YouTube Downloader Bot
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $botPath = "C:\youtube_downloader_bot"
          if (Test-Path $botPath) { Remove-Item -Path $botPath -Recurse -Force }
          git clone "https://github.com/siasoltoon/youtube_downloader_bot.git" $botPath
          Set-Location $botPath
          Write-Host "Bot repository cloned."
          Write-Host "Commit: $(git rev-parse --short HEAD)"

      - name: 6. Bootstrap Windows Bot Environment
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\setup_windows.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows bootstrap failed." }

      - name: 7. Validate Bot Configuration
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("BOT_TOKEN","FILONE_ACCESS_KEY","FILONE_SECRET_KEY","FILONE_BUCKET","FILONE_ENDPOINT")
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) { throw "Required bot environment variable is missing: $name" }
          }
          py -3.13 scripts\healthcheck.py
          if ($LASTEXITCODE -ne 0) { throw "Bot health check failed." }

      - name: 8. Start YouTube Downloader Bot
        shell: powershell
        working-directory: C:\youtube_downloader_bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          FILONE_ACCESS_KEY: ${{ secrets.FILONE_ACCESS_KEY }}
          FILONE_SECRET_KEY: ${{ secrets.FILONE_SECRET_KEY }}
          FILONE_BUCKET: ${{ secrets.FILONE_BUCKET }}
          FILONE_ENDPOINT: ${{ secrets.FILONE_ENDPOINT }}
          FILONE_URL_EXPIRES: ${{ secrets.FILONE_URL_EXPIRES }}
          TELEGRAM_DIRECT_VIDEO_LIMIT_MB: ${{ secrets.TELEGRAM_DIRECT_VIDEO_LIMIT_MB }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_POT_PROVIDER_URL: ${{ secrets.YOUTUBE_POT_PROVIDER_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $stdout = "C:\youtube_downloader_bot\bot.log"
          $stderr = "C:\youtube_downloader_bot\bot-error.log"
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue
          $python = (& py -3.13 -c "import sys; print(sys.executable)").Trim()
          if ([string]::IsNullOrWhiteSpace($python) -or -not (Test-Path $python)) { throw "Could not resolve the Python 3.13 executable." }
          $process = Start-Process -FilePath $python -ArgumentList "-u bot.py" -WorkingDirectory "C:\youtube_downloader_bot" -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $process.Id | Out-File -FilePath $pidFile -Encoding ascii
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) {
            if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
            if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
            throw "YouTube Downloader Bot stopped during startup."
          }
          Write-Host "Bot is running successfully. PID: $($process.Id)"

      - name: 9. Keep Windows VM Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          for ($minute = 0; $minute -lt 350; $minute += 5) {
            Start-Sleep -Seconds 300
            if (Test-Path $pidFile) {
              $botPid = Get-Content $pidFile -ErrorAction SilentlyContinue
              if ($botPid) {
                $botProcess = Get-Process -Id ([int]$botPid) -ErrorAction SilentlyContinue
                if (-not $botProcess) {
                  Write-Host "Bot process is no longer running."
                  if (Test-Path "C:\youtube_downloader_bot\bot-error.log") { Get-Content "C:\youtube_downloader_bot\bot-error.log" -Tail 100 }
                  if (Test-Path "C:\youtube_downloader_bot\bot.log") { Get-Content "C:\youtube_downloader_bot\bot.log" -Tail 100 }
                  break
                }
                Write-Host "[$minute min] Bot PID $botPid is still running."
              }
            }
          }

      - name: 10. Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $pidFile = "C:\youtube_downloader_bot\bot.pid"
          if (Test-Path $pidFile) {
            $botPid = Get-Content $pidFile -ErrorAction SilentlyContinue
            if ($botPid) { Stop-Process -Id ([int]$botPid) -Force -ErrorAction SilentlyContinue }
          }
          Get-Process -Name "sunshine" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "parsec","parsecd","pservice" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup complete."
